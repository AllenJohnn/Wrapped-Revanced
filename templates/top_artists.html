<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Top Artists - Wrapped Revanced</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      background: linear-gradient(160deg, #000000, #121212, #0f0f0f);
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      padding: 40px 0 20px 0;
    }

    h1 {
      font-size: 2.5rem;
      color: #1DB954;
      text-shadow: 0 0 10px #1DB954;
    }

    .artists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      padding: 40px;
      width: 100%;
      max-width: 1000px;
      box-sizing: border-box;
    }

    .artist-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.1);
    }

    .artist-card:hover {
      transform: scale(1.05);
      background: rgba(29, 185, 84, 0.15);
      box-shadow: 0 0 40px rgba(29, 185, 84, 0.4);
    }

    .artist-card img {
      width: 100%;
      height: 200px;
      border-radius: 15px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .artist-card h2 {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .artist-card a {
      color: #1DB954;
      text-decoration: none;
      font-weight: 600;
    }

    .artist-card a:hover {
      color: #1ed760;
      text-shadow: 0 0 10px #1ed760;
    }

    .back {
      margin: 30px;
      background-color: #1DB954;
      color: #fff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back:hover {
      background-color: #1ed760;
      transform: scale(1.05);
    }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.9rem;
      color: #b3b3b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Your Top Artists 🎧</h1>
  </header>

  <div class="artists">
    {% for artist in artists %}
      <div class="artist-card">
        {% if artist.image %}
          <img src="{{ artist.image }}" alt="{{ artist.name }}">
        {% endif %}
        <h2>{{ artist.name }}</h2>
        <a href="{{ artist.url }}" target="_blank">Open on Spotify ↗</a>
      </div>
    {% endfor %}
  </div>

  <a href="/" class="back">← Back to Home</a>

  <footer>
    Wrapped Revanced • Powered by Spotify API
  </footer>
</body>
</html>
